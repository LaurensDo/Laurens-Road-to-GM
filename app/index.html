<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d6b58" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Road to GM" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Road to GM</title>
    <script>
      // Startfarbe vor dem ersten Bild, damit beim Öffnen nichts weiß aufblitzt (außer das Startbild ist abgeschaltet)
      try {
        if (JSON.parse(localStorage.getItem('road-to-gm-device-v1') || '{}').splash !== false) document.documentElement.style.background = '#0d2c24';
      } catch (e) {
        document.documentElement.style.background = '#0d2c24';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
